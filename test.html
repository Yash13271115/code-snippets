<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font or CDNFonts -->
    <link href="https://fonts.cdnfonts.com/css/roboto-bold" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <title>Faithful</title>

    <style>
      body {
        font-family: "RobotoBold", sans-serif;
      }
    </style>
  </head>

  <body class="bg-white text-black">
    <!-- NAVBAR -->
    <nav class="flex justify-between items-center px-10 py-6">
      <h1 class="font-bold text-xl">Faithful</h1>

      <div class="text-2xl">
        <i class="fa-solid fa-shapes"></i>
      </div>

      <div class="flex items-center gap-6">
        <a href="#" class="text-gray-600 hover:text-black font-bold">Login</a>
        <a href="#" class="text-gray-600 hover:text-black font-bold">Sign In</a>
      </div>
    </nav>

    <!-- HERO SECTION -->
    <section class="relative w-full text-center py-3">
      <p class="text-gray-800 font-semibold">
        Powerful, fast, and built for you.
      </p>

      <h1
        class="text-5xl md:text-8xl font-[900] leading-none uppercase my-8 tracking-[0.05em] transform-[scaleY(2)]"
      >
        HODLERS
      </h1>

      <button
        class="mt-8 px-12 py-2.5 bg-black text-white rounded-lg hover:bg-gray-800"
      >
        Get started
      </button>

      <img
        src="https://i.pinimg.com/736x/34/16/2c/34162cf451b3c947a73f088c559722e2.jpg"
        alt="floating-image"
        class="absolute bottom-45 left-1/20 w-10 opacity-70 animate-floating rotate-90"
      />

      <img
        src="https://i.pinimg.com/736x/db/6c/be/db6cbe53d8743326fbe44e1f95580285.jpg"
        alt="floating-image"
        class="absolute bottom-60 left-1/5 w-16 opacity-70 animate-floating"
      />

      <img
        src="https://i.pinimg.com/736x/34/16/2c/34162cf451b3c947a73f088c559722e2.jpg"
        alt="floating-image"
        class="absolute bottom-35 left-1/3 w-12 opacity-70 animate-floating"
      />

      <img
        src="https://i.pinimg.com/736x/34/16/2c/34162cf451b3c947a73f088c559722e2.jpg"
        alt="floating-image"
        class="absolute bottom-90 right-1/3 w-14 opacity-70 animate-floating"
      />

      <img
        src="https://i.pinimg.com/736x/db/6c/be/db6cbe53d8743326fbe44e1f95580285.jpg"
        alt="floating-image"
        class="absolute bottom-30 right-1/8 w-22 opacity-70 animate-floating"
      />

      <img
        src="https://i.pinimg.com/736x/db/6c/be/db6cbe53d8743326fbe44e1f95580285.jpg"
        alt="floating-image"
        class="absolute bottom-100 right-0 w-16 opacity-70 animate-floating"
      />

      <!-- Mockup -->
      <div class="relative mt-5 flex justify-center">
        <img
          src="https://i.pinimg.com/736x/40/c1/06/40c1067a66934fef9e01a69db9fb8f77.jpg"
          alt="mockup"
          class="w-64 md:w-1/4"
        />
      </div>
    </section>

    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>
  </body>
</html>
